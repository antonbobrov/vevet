<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · yyJBxNK</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.elastic-cursor {
  background: transparent;
  border: 2px solid rgba(255, 255, 255, 0.3);
  background-color: rgba(255, 255, 255, 0.1);
  border-radius: 50%;
}

.dot-cursor {
  background-color: #fff;
  border-radius: 50%;
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Elastic Cursor</h1>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const elasticCursor = new Cursor({
  lerp: 0.3,
  width: 80,
  height: 80,
  transformModifier: ({
    x,
    y,
    angle,
    velocity
  }) => {
    const scale = velocity * 0.2;
    const scaleX = 1 + scale;
    const scaleY = 1 - scale;

    return `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${scaleX}, ${scaleY})`;
  }
});

elasticCursor.inner.classList.add("elastic-cursor");

const dotCursor = new Cursor({
  lerp: 0.5,
  width: 10,
  height: 10,
  hideNative: true
});

dotCursor.inner.classList.add("dot-cursor");

  </script>
      </body>
    </html>
