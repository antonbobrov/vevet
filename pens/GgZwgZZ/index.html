        <style>.container {
  width: 100%;
  padding: 0 1rem;
}

h1 {
  margin: 0 0 1.25rem;
  font-size: 2rem;
  font-weight: 600;
}

p {
  margin: 0.5em 0;
}

.animate {
  opacity: 0;
}

.fadeInUp {
  animation: fade-in-up;
  animation-duration: 0.5s;
  animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
  animation-fill-mode: both;
}

.fadeInDown {
  animation: fade-in-down;
  animation-duration: 0.5s;
  animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
  animation-fill-mode: both;
}

@keyframes fade-in-up {
  from {
    transform: translateY(5rem);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes fade-in-down {
  from {
    transform: translateY(-5rem);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <button type="button" class="btn" id="toggle">Enable</button>

  <div class="container">

  <script type="module">
import {
  InView
} from "https://esm.sh/vevet@5";

const instance = new InView({
  enabled: false,
  maxInitialDelay: 700
});

const elements = document.querySelectorAll("*[data-in-view-class]");
elements.forEach(element => {
  instance.addElement(element);
});

const toggle = document.getElementById("toggle");

toggle.addEventListener("click", () => {
  instance.updateProps({
    enabled: !instance.props.enabled
  });

  toggle.innerHTML = instance.props.enabled ? "Disable" : "Enable";
});

  </script>
