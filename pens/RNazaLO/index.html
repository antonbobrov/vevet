<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · RNazaLO</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.v-cursor__inner {
  background-color: transparent !important;
  border: 2px solid #fff;
  border-radius: 50%;
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Move Your Cursor</h1>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const count = 15;

for (let index = 0; index < count; index += 1) {
  const lerp = 0.1;

  new Cursor({
    lerp: lerp - lerp * 0.7 / count * index,
    behavior: "path" // comment this line to see difference
  });
}

  </script>
      </body>
    </html>
