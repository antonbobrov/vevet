<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · qEZGMyP</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>.fullpage-center {
  padding: 1rem;
}

h1 {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.grid {
  width: 100%;
  max-width: 30rem;
  display: grid;
  gap: 0.5rem;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.item {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;

  transition: color 1s, background-color 1s;

  &:hover {
    background-color: rgba(255, 255, 255, 0.15);
  }
}

.v-cursor__inner {
  background-color: transparent !important;
  border: 2px solid #fff;
  border-radius: 4px;
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Dynamic Cursor Size</h1>

  <div class="grid">
    <div class="item" data-small>Small</div>

    <div class="item" data-has-padding>With Padding</div>

    <div class="item" data-no-padding>No Padding</div>
  </div>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const cursor = new Cursor();

cursor.attachHover({
  element: document.querySelector("[data-small]"),
  width: 20,
  height: 10
});

cursor.attachHover({
  element: document.querySelector("[data-has-padding]"),
  width: "auto",
  height: "auto",
  padding: 10
});

cursor.attachHover({
  element: document.querySelector("[data-no-padding]"),
  width: "auto",
  height: "auto"
});

  </script>
      </body>
    </html>
