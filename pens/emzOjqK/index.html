<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · emzOjqK</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>.fullpage-center {
  padding: 1rem;
}

h1 {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.grid {
  width: 100%;
  max-width: 30rem;
  display: grid;
  gap: 0.5rem;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.item {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;

  transition: color 1s, background-color 1s;

  &:hover {
    background-color: rgba(255, 255, 255, 0.15);
  }
}

.bg-cursor {
  background: transparent;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
}

.dot-cursor {
  background-color: #fff;
  border-radius: 50%;
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Custom Sticky Cursor</h1>

  <div class="grid">
    <div class="item" data-sticky-x>Sticky-X</div>

    <div class="item" data-sticky-y>Sticky-Y</div>

    <div class="item" data-sticky-xy>Sticky-XY</div>
  </div>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const bgCursor = new Cursor({
  lerp: 0.1,
  width: 80,
  height: 80
});

bgCursor.inner.classList.add("bg-cursor");

const dotCursor = new Cursor({
  lerp: 0.5,
  width: 10,
  height: 10,
  hideNative: true
});

dotCursor.inner.classList.add("dot-cursor");

const stickyX = document.querySelector("[data-sticky-x]");

const stickyY = document.querySelector("[data-sticky-y]");

const stickyXY = document.querySelector("[data-sticky-xy]");

bgCursor.attachHover({
  element: stickyX,
  snap: true,
  width: 30,
  height: 30,
  sticky: true,
  stickyAmplitude: {
    x: 10,
    y: 0
  },
  stickyLerp: 0.2
});

bgCursor.attachHover({
  element: stickyY,
  snap: true,
  width: 30,
  height: 30,
  sticky: true,
  stickyAmplitude: {
    x: 0,
    y: 20
  },
  stickyLerp: 0.2
});

bgCursor.attachHover({
  element: stickyXY,
  snap: true,
  width: 30,
  height: 30,
  sticky: true,
  stickyAmplitude: 10,
  stickyLerp: 0.2
});

  </script>
      </body>
    </html>
