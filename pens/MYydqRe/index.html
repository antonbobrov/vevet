<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · MYydqRe</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>.fullpage-center {
  padding: 1rem;
}

h1 {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.grid {
  width: 100%;
  max-width: 30rem;
  display: grid;
  gap: 0.5rem;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.item {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;

  transition: color 1s, background-color 1s;

  &:hover {
    background-color: rgba(255, 255, 255, 0.15);
  }
}

.v-cursor__inner {
  background-color: transparent !important;
  border: 2px solid #fff;
  border-radius: 4px;
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Snapping Cursor</h1>

  <div class="grid">
    <div class="item" data-simple>Simple</div>

    <div class="item" data-snap>Snap</div>
  </div>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const cursor = new Cursor();

cursor.attachHover({
  element: document.querySelector("[data-simple]"),
  width: "auto",
  height: "auto"
});

cursor.attachHover({
  element: document.querySelector("[data-snap]"),
  width: "auto",
  height: "auto",
  snap: true
});

  </script>
      </body>
    </html>
