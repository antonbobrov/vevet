<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · xbONPYr</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>.fullpage-center {
  padding: 1rem;
}

h1 {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.dot-cursor {
  background: var(--gradient-peach);
  border-radius: 50%;
}

.hover {
  position: relative;
  width: 10rem;
  height: 10rem;
  border-radius: 1rem;
}

.hover-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.1);
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Sticky Ghost</h1>

  <div class="hover">
    <div class="hover-bg"></div>
    <div class="hover-bg"></div>
    <div class="hover-bg"></div>
    <div class="hover-bg"></div>
    <div class="hover-bg"></div>
  </div>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const dotCursor = new Cursor({
  lerp: 0.25,
  width: 10,
  height: 10,
  lerp: 0.2
});

dotCursor.inner.classList.add("dot-cursor");

const bgs = document.querySelectorAll(".hover-bg");

bgs.forEach((bg, index) => {
  dotCursor.attachHover({
    element: bg,
    emitter: bg.parentElement,
    width: 16,
    height: 16,
    sticky: true,
    stickyFriction: 0.2 - index * 0.035
  });

});

  </script>
      </body>
    </html>
