<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · LENXYqq</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>body {
  direction: rtl;
}

.container {
  width: max-content;
  height: 100vh;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  padding: 0 1rem;
}

h1 {
  margin: 1rem;
  font-size: 2rem;
  font-weight: 600;
}

.rect {
  margin: 0.5rem;
  height: 12rem;
  width: 12rem;

  border-radius: 0.75rem;
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.12);

  opacity: 0;
}

.visible {
  animation: fade-in-scale;
  animation-duration: 0.5s;
  animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
  animation-fill-mode: both;
}

@keyframes fade-in-scale {
  from {
    opacity: 0;
    transform: scale(0.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}</style>
      </head>
      <body>
        <div class="container">
  <h1 class="animate">InView</h1>

  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
  <div class="rect" data-in-view-class="visible"></div>
</div>
        
  <script type="module">
import {
  InView
} from "https://esm.sh/vevet@5";
import {
  animate,
  stagger
} from "https://esm.sh/animejs@4";

const inView = new InView({
  scrollDirection: "horizontal"
});

const elements = document.querySelectorAll(".rect");

elements.forEach(element => {
  inView.addElement(element);
});

  </script>
      </body>
    </html>
