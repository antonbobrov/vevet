<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vevet pen · azZrVwJ</title>
        <link rel="stylesheet" href="https://vevetjs.com/shared/codepen-styles.css" />
        <style>.fullpage-center {
  padding: 1rem;
}

h1 {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
  font-weight: 600;
  text-align: center;
}

.grid {
  width: 100%;
  max-width: 30rem;
  display: grid;
  gap: 0.5rem;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.item {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;

  transition: color 1s, background-color 1s;

  &:hover {
    background-color: rgba(255, 255, 255, 0.15);
  }
}

.dot-cursor {
  background: var(--gradient-peach);
  border-radius: 50%;
}</style>
      </head>
      <body>
        <div class="fullpage-center">
  <h1>Cursor Behavior</h1>

  <div class="grid">
    <div class="item js-snap">Snap</div>
    <div class="item js-sticky">Sticky</div>
    <div class="item js-friction">Friction</div>
  </div>
</div>
        
  <script type="module">
import {
  Cursor
} from "https://esm.sh/vevet@5";

const dotCursor = new Cursor({
  lerp: 0.25,
  width: 10,
  height: 10
});

dotCursor.inner.classList.add("dot-cursor");

dotCursor.attachHover({
  element: document.querySelector(".js-snap"),
  width: 16,
  height: 16,
  snap: true
});

dotCursor.attachHover({
  element: document.querySelector(".js-sticky"),
  width: 16,
  height: 16,
  snap: true,
  sticky: true,
  stickyAmplitude: {
    x: 0,
    y: 20
  }
});

dotCursor.attachHover({
  element: document.querySelector(".js-friction"),
  width: 16,
  height: 16,
  sticky: true,
  stickyFriction: 0.5
});

  </script>
      </body>
    </html>
